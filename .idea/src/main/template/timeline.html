<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e0f;
      --surface: #1a1a1c;
      --border: #2e2e32;
      --text: #e8e6e1;
      --muted: #6b6a68;
      -
      --node-r: 10;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: white;
      color: var(--text);
      font-family: "DM Mono", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 80px;
    }

    .form-table, .form-table td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 15px;
      color: black;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
    }

    .timeline-table, .timeline-table td {
      border: 1px solid black;
      border-collapse: collapse;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      padding:10px;
    }

    #chart-wrap {
      width: 100%;
      height: 100%;
      background: white;
      margin-top: 100px;
      padding: 32px 24px 24px;
      overflow-x: auto;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg#timeline {
      display: block;
      overflow: visible;
    }

    /* Grid lines */
    .grid-line {
      stroke: black;
      stroke-width: 1;

    }

    .button-container {
      display: flex;
      gap: 10px;
      justify-content: center;

    }

    #grid-toggle-btn {
      margin-top: 28px;
      background: none;
      border: 1px solid rgb(23, 61, 245);
      color: black;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 10px 20px;
      cursor: pointer;

      margin-left: 10px;
      transition: border-color 0.2s, color 0.2s;
    }
    #grid-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

    #line-toggle-btn {
      margin-top: 28px;
      background: none;
      border: 1px solid rgb(23, 61, 245);
      color: black;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 10px 20px;
      cursor: pointer;

      margin-left: 10px;
      transition: border-color 0.2s, color 0.2s;
    }
    #line-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Add node button */
    #add-btn {
      margin-top: 28px;
      background: none;
      border: 1px solid  rgb(23, 61, 245);
      color: black;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 10px 20px;
      cursor: pointer;

      transition: border-color 0.2s, color 0.2s;
    }
    #add-btn:hover { border-color: var(--accent); color: var(--accent); }


    /* Category labels */
    .cat-label {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      fill: black;
      text-anchor: end;
      dominant-baseline: middle;
      letter-spacing: 0.05em;
    }

    /* Year labels */
    .year-label {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      fill: black;
      text-anchor: middle;
      letter-spacing: 0.05em;
    }

    /* Nodes */
    .node-circle {
      cursor: pointer;
      transition: r 0.15s ease, filter 0.15s ease;
    }
    .node-circle:hover {
      filter: drop-shadow(0 0 8px currentColor);
    }

    .node-pulse {
      pointer-events: none;
      opacity: 0;
    }
    .node-pulse.pulsing {
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { r: 20; opacity: 0.6; }
      100% { r: 36; opacity: 0; }
    }

    /* Popup overlay */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.15);
      z-index: 100;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    #overlay.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #popup {
      background: white;
      max-width: 560px;
      width: 90%;
      overflow: hidden;
      animation: slideUp 0.22s cubic-bezier(.22,.68,0,1.2);
      position: relative;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #popup-header {
      background: rgb(23, 61, 245);;
     font: white;
      padding: 6px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;

    }

    #close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #0e0e0f;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
    }
    #close-btn:hover { opacity: 1; }

    .timeline-popup-header {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: black;
      padding: 8px 16px;
      border-bottom: 1px solid black;
    }

    .timeline-item-date {
      font-family: 'DM Mono', monospace;
      color: black;
      padding: 16px 16px 8px;
      vertical-align: top;
      line-height: 1.4;
      border-bottom: 1px solid black;  /* ← added */
    }

    .timeline-item-date-sub {
      font-size: 0.75rem;
      color: #6b6a68;
      font-weight: 300;
    }



    .timeline-item-text {
      font-size: 0.875rem;
      color: black;

    }

    .media-cell {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-cell img {
      justify-content: center;
      border: none;

    }
    .source-cell {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: black;
      word-break: break-all;
    }


    .source-cell a:hover { text-decoration: underline; }



    /* Add Node Modal */
    #form-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(1px);
      animation: fadeIn 0.2s ease;
    }
    #form-overlay.open { display: flex; }

    #form-modal {
      background: white;
      width: 90%;
      max-width: 480px;
      overflow: hidden;
      animation: slideUp 0.22s cubic-bezier(.22,.68,0,1.2);

    }

    #form-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.7;
      margin-left: 5px;

    }
    #form-close-btn:hover { opacity: 1; }

    #form-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      background: white;
      border: none;
      color: black;
      font-family: 'DM Mono', monospace;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    .f-te
    .form-field select option { background: var(--surface); }


    .btn-cancel {
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
      cursor: pointer;

      transition: border-color 0.2s, color 0.2s;
    }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

    .btn-send {
      background: var(--accent);
      border: none;
      font-family: 'DM Mono', monospace;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-send:hover { border-color: var(--muted); color: var(--text); }

    #line-example {
      align-self: flex-start;
      margin-left: 24px;
    }

    .line-example-table, .line-example-table td {
        border: 1px solid black;
        color: black;
        border-collapse: collapse;
        font-family: 'DM Mono', monospace;
        font-size: 14px;
        padding:10px;
        margin-top: 40px;
        max-width: 400px ;
    }

  </style>
</head>
<body>



<div id="chart-wrap">
  <svg id="timeline"></svg>
</div>

<div class="button-container">
  <button id="add-btn" onclick="openAddForm()">Add Event</button>
  <button id="grid-toggle-btn" onclick="toggleGrid()">Hide Grid</button>
  <button id="line-toggle-btn" onclick="toggleLines()">Hide Lines</button>
</div>

<div id="line-example">
  <table  class="line-example-table">
    <tr>
      <td>LINE TYPE</td>
      <td>MEANING</td>
    </tr>
    <tr>
      <td>
        <svg width="100" height="20"><line x1="0" y1="10" x2="100" y2="10" stroke="black" stroke-width="2"/></svg>
      </td>
      <td>
        Full line — direct, confirmed connection: One event directly caused or triggered another
      </td>
    </tr>
    <tr>
      <td>
        <svg width="100" height="20"><line x1="0" y1="10" x2="100" y2="10" stroke="black" stroke-width="2" stroke-dasharray="4 4"/></svg>
      </td>

      <td>
        Dashed line — indirect or suspected connection: One event may have contributed to another, but the relationship is not definitively established
      </td>
    </tr>
  </table>
</div>





<!-- Add Node Modal -->
<div id="form-overlay">
  <div id="form-modal">
    <div id="form-body">
      <table class="form-table">
        <tr >
          <td>
            <button id="form-close-btn" onclick="closeAddForm()">✕</button>
          </td>
           <td colspan="2"> Submit Event Suggestion </td>
        </tr>
        <tr>
          <td><label for="f-date">Date</label></td>
          <td><label for="f-category">Category</label></td>
          <td><label for="f-title">Title</label></td>
        </tr>
        <tr>
          <td><input type="date" id="f-date" min="2004-01-01" max="2011-12-31" value="2005-01-01"></td>
          <td>
            <select id="f-category">
              <option>NSU</option>
              <option>Politics</option>
              <option>Legal</option>
              <option>Attack</option>
              <option>Media</option>
              <option>Other</option>
            </select>
          </td>
          <td><input type="text" id="f-title" placeholder="Event title"></td>
        </tr>

        <tr>
          <td><label for="f-text">Description</label></td>
          <td colspan="3"><textarea id="f-text"  placeholder="Describe the event…"></textarea></td>
        </tr>
        <tr>
          <td><label for="f-source">Source URL (you must provide some form of proof.)</label></td>
          <td colspan="3"><input type="url" id="f-source" placeholder="https://…"></td>
        </tr>
        <tr>
          <td><label for="f-image">Image URL (optional)</label></td>
          <td colspan="3"><input type="url" id="f-image" placeholder="https://…" ></td>
        </tr>
        <tr>
          <td colspan="1">
            <button class="btn-cancel" onclick="closeAddForm()">Cancel</button>
          </td>
          <td colspan="2">
            <button class="btn-send" onclick="submitNodeByEmail()">Send Request</button>
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>

<!-- Popup -->
<div id="overlay">
  <div id="popup">
    <div id="popup-header"></div>
    <button id="close-btn" onclick="closePopup()">✕</button>
    <table class="timeline-table" id="popup-table"></table>
  </div>
</div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────────────────────────
  const MARGIN = { top: 30, right: 40, bottom: 50, left: 110 };
  const ROW_H = 64;
  const START_YEAR = 2004;
  const END_YEAR = 2011;

  const CAT_COLORS = {
    "NSU":        "#c9a84c",
    "Politics":   "#7c5cbf",
    "Legal":      "#3a9e7e",
    "Attack":     "#c9534c",
    "Media":      "#4c7ec9",
    "Other":      "#a0a0a0",
    "default":    "#4c7ec9"

  };

  function categoryColor(cat) {
    return "rgb(23, 61, 245)"; ;
  }

  // ─── SAMPLE DATA ─────────────────────────────────────────────────────────────
  let nodes = [

    {
      date: "2004-06-09",
      category: "NSU",
      title: "Nail Bomb Attack",
      content: {
        text: "A nail bomb explodes in Keupstraße, injuring 22 people. The attack targets the Turkish and Kurdish community in Cologne.",
        media: { type: "image", url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ088T8eOprVaBj7gYR6N1yxsWD3rZP6up5vw&s", alt: "Keupstraße after the attack" }
      },
      source: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ088T8eOprVaBj7gYR6N1yxsWD3rZP6up5vw&s",
      connections: [
        { to: "NSU Uncovered", style: "solid" },
        { to: "Dortmund Bombing", style: "dotted" }
      ]
    },
    {
      date: "2004-06-09",
      category: "Police",
      title: "Nail Bomb Attack",
      content: {
        text: "A nail bomb explodes in Keupstraße, injuring 22 people. The attack targets the Turkish and Kurdish community in Cologne.",
        media: { type: "image", url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ088T8eOprVaBj7gYR6N1yxsWD3rZP6up5vw&s", alt: "Keupstraße after the attack" }
      },
      source: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ088T8eOprVaBj7gYR6N1yxsWD3rZP6up5vw&s"
    },
    {
      date: "2006-04-06",
      category: "Attack",
      title: "Dortmund Bombing",
      content: {
        text: "A nail bomb attack in Dortmund wounds 29 people. Police initially pursue wrong suspects, missing the true perpetrators.",
        media: { type: "image", url: "https://via.placeholder.com/148x148/c9534c/ffffff?text=Dortmund", alt: "Dortmund bombing scene" }
      },
      source: "https://example.com/dortmund"
    },
    {
      date: "2007-11-25",
      category: "Legal",
      title: "Failed Investigation",
      content: {
        text: "Internal memos reveal investigators dismissed evidence pointing to a far-right network, focusing instead on organised crime theories.",
        media: null
      },
      source: "https://example.com/investigation"
    },
    {
      date: "2009-03-10",
      category: "Politics",
      title: "Parliamentary Question",
      content: {
        text: "Opposition MPs raise questions in the Bundestag about the pattern of unsolved murders targeting ethnic minority business owners.",
        media: null
      },
      source: "https://example.com/bundestag"
    },
    {
      date: "2011-11-04",
      category: "NSU",
      title: "NSU Uncovered",
      content: {
        text: "Following a botched bank robbery and the suicide of Uwe Mundlos and Uwe Böhnhardt, Beate Zschäpe burns down the safehouse, exposing the NSU cell.",
        media: { type: "image", url: "https://via.placeholder.com/148x148/c9a84c/000000?text=NSU+2011", alt: "NSU exposed" }
      },
      source: "https://example.com/nsu-exposed"
    },
    {
      date: "2011-06-15",
      category: "Media",
      title: "Press Coverage Gap",
      content: {
        text: "Analysis shows major German newspapers gave minimal front-page coverage to the Doner murders despite nine victims over seven years.",
        media: null
      },
      source: "https://example.com/media"
    },
  ];

  // ─── RENDER ───────────────────────────────────────────────────────────────────
  function getCategories() {
    const set = new Set(nodes.map(n => n.category));
    return [...set];
  }

  function dateToYear(dateStr) {
    const d = new Date(dateStr);
    return d.getFullYear() + (d.getMonth()) / 12 + d.getDate() / 365;
  }

  function render() {
    const svg = document.getElementById('timeline');
    const wrap = document.getElementById('chart-wrap');
    const W = Math.max(wrap.clientWidth - 48, 600);
    const categories = getCategories();
    const H = MARGIN.top + categories.length * ROW_H + MARGIN.bottom;

    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.innerHTML = '';

    const innerW = W - MARGIN.left - MARGIN.right;
    const innerH = H - MARGIN.top - MARGIN.bottom;

    const g = svgEl('g', { transform: `translate(${MARGIN.left},${MARGIN.top})` });
    svg.appendChild(g);

    // X scale
    const xRange = END_YEAR + 1 - START_YEAR;
    const xScale = x => ((x - START_YEAR) / xRange) * innerW;

    // Y scale
    const yScale = cat => {
      const i = categories.indexOf(cat);
      return i * ROW_H + ROW_H / 2;
    };

    // Grid + category labels
    categories.forEach((cat, i) => {
      const y = yScale(cat);
      // horizontal grid line
      g.appendChild(svgEl('line', { x1: 0, y1: y, x2: innerW, y2: y, class: 'grid-line' }));
      // label
      const txt = svgEl('text', { x: -12, y: y, class: 'cat-label' });
      txt.textContent = cat;
      g.appendChild(txt);

    });

    // Year ticks + vertical grid
    for (let yr = START_YEAR; yr <= END_YEAR + 1; yr++) {
      const x = xScale(yr);
      g.appendChild(svgEl('line', { x1: x, y1: 0, x2: x, y2: innerH, class: 'grid-line', opacity: 0.5 }));
      const txt = svgEl('text', { x: x, y: innerH + 22, class: 'year-label' });
      txt.textContent = yr;
      g.appendChild(txt);
    }

    // X axis line
    g.appendChild(svgEl('line', { x1: 0, y1: innerH, x2: innerW, y2: innerH, stroke: '#3e3e44', 'stroke-width': 1 }));

    // Nodes
    // ── Build a title→index lookup for connections ──
    const titleIndex = {};
    nodes.forEach((node, i) => { titleIndex[node.title] = i; });

// ── Connections (drawn before nodes so lines sit underneath) ──
    nodes.forEach((node, idx) => {
      if (!node.connections) return;
      const x1 = xScale(dateToYear(node.date));
      const y1 = yScale(node.category);

      node.connections.forEach(conn => {
        const targetIdx = titleIndex[conn.to];
        if (targetIdx === undefined) return;
        const target = nodes[targetIdx];
        const x2 = xScale(dateToYear(target.date));
        const y2 = yScale(target.category);

        const line = svgEl('line', {
          x1, y1, x2, y2,
          stroke: 'rgb(23, 61, 245)',
          'stroke-width': 4,
          'stroke-dasharray': conn.style === 'dotted' ? '6 4' : 'none',
          'pointer-events': 'none',
          class: 'tl-connection',
          'data-from': idx,
          'data-to': targetIdx,
        });
        g.appendChild(line);
      });
    });

// Nodes
    nodes.forEach((node, idx) => {
      const x = xScale(dateToYear(node.date));
      const y = yScale(node.category);
      const color = categoryColor(node.category);

      const ng = svgEl('g', { class: 'node-group', 'data-idx': idx });

      const pulse = svgEl('circle', { cx: x, cy: y, r: 40, fill: 'none', stroke: color, 'stroke-width': 2, class: 'node-pulse' });
      ng.appendChild(pulse);


      // main circle
      const circle = svgEl('circle', {
        cx: x, cy: y, r: 20,
        fill: color,
        class: 'node-circle',
      });
      circle.style.color = color;

      circle.addEventListener('click', () => openPopup(idx, color));

      circle.addEventListener('mouseenter', () => {
        const connectedIndices = new Set();
        connectedIndices.add(idx); // include hovered node itself

        if (node.connections) {
          node.connections.forEach(conn => {
            const ti = titleIndex[conn.to];
            if (ti !== undefined) connectedIndices.add(ti);
          });
        }

        nodes.forEach((otherNode, otherIdx) => {
          if (!otherNode.connections) return;
          otherNode.connections.forEach(conn => {
            if (conn.to === node.title) connectedIndices.add(otherIdx);
          });
        });

        // pulse connected nodes
        connectedIndices.forEach(ci => {
          const target = document.querySelector(`.node-group[data-idx="${ci}"] .node-pulse`);
          if (target) target.classList.add('pulsing');
        });

        // dim all nodes NOT in the connected set
        nodes.forEach((_, otherIdx) => {
          if (connectedIndices.has(otherIdx)) return;
          const otherCircle = document.querySelector(`.node-group[data-idx="${otherIdx}"] .node-circle`);
          if (otherCircle) otherCircle.style.filter = 'brightness(0.35)';
        });

        // dim all lines NOT between highlighted nodes
        document.querySelectorAll('.tl-connection').forEach(line => {
          const from = parseInt(line.getAttribute('data-from'));
          const to = parseInt(line.getAttribute('data-to'));
          const isHighlighted = connectedIndices.has(from) && connectedIndices.has(to);
          line.style.opacity = isHighlighted ? '1' : '0.1';
        });
      });

      circle.addEventListener('mouseleave', () => {
        // remove pulsing
        document.querySelectorAll('.node-pulse.pulsing').forEach(el => {
          el.classList.remove('pulsing');
        });
        // restore all nodes
        document.querySelectorAll('.node-circle').forEach(el => {
          el.style.filter = '';
        });
        // restore all lines
        document.querySelectorAll('.tl-connection').forEach(el => {
          el.style.opacity = '';
        });
      });

      ng.appendChild(circle);

      g.appendChild(ng);
    });



  }

  // ─── POPUP ───────────────────────────────────────────────────────────────────
  function renderMedia(media) {
    if (!media) return '';
    if (media.type === 'image') {
      return `<img src="${media.url}" alt="${media.alt || ''}" onerror="this.style.display='none'" >`;
    }
    return '';
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function openPopup(idx, color) {
    const item = nodes[idx];
    const displayDate = formatDate(item.date);
    const header = document.getElementById('popup-header');
    header.textContent = item.category;

    const mediaHTML = renderMedia(item.content.media);
    const hasMedia = !!item.content.media;

    const table = document.getElementById('popup-table');
    table.innerHTML = `

  <tr>
    <td class="timeline-item-date" colspan="4">
      ${item.title}<br>
      <span class="timeline-item-date-sub">${displayDate}</span>
    </td>
  </tr>
  <tr>
    <td class="timeline-item-text" rowspan="2" colspan="2">${item.content.text}</td>
    ${hasMedia ? `<td class="media-cell" rowspan="2" colspan="2">${mediaHTML}</td>`
            : '<td colspan="2" rowspan="2"></td>'}
  </tr>
  <tr></tr>
  <tr>
    <td class="source-cell" colspan="4">
      Source: <a href="${item.source}">${item.source}</a>
    </td>
  </tr>
  `;

    document.getElementById('overlay').classList.add('open');
  }

  function closePopup() {
    document.getElementById('overlay').classList.remove('open');
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closePopup();
  });

  // ─── GRID TOGGLE ─────────────────────────────────────────────────────────────
  let gridVisible = true;

  function toggleGrid() {
    gridVisible = !gridVisible;
    document.querySelectorAll('.grid-line').forEach(el => {
      el.style.display = gridVisible ? '' : 'none';
    });
    document.getElementById('grid-toggle-btn').textContent = gridVisible ? '⊞ Hide Grid' : '⊞ Show Grid';
  }

  let linesVisible = true;

  function toggleLines() {
    linesVisible = !linesVisible;
    document.querySelectorAll('.tl-connection').forEach(el => {
      el.style.display = linesVisible ? '' : 'none';
    });
    document.getElementById('line-toggle-btn').textContent = linesVisible ? '⌇ Hide Lines' : '⌇ Show Lines';
  }

  // ─── ADD NODE FORM ────────────────────────────────────────────────────────────
  function openAddForm() {
    // Reset form
    document.getElementById('f-date').value = '2005-01-01';
    document.getElementById('f-category').value = 'NSU';
    document.getElementById('f-title').value = '';
    document.getElementById('f-text').value = '';
    document.getElementById('f-source').value = '';
    document.getElementById('f-image').value = '';
    document.getElementById('form-overlay').classList.add('open');
  }

  function closeAddForm() {
    document.getElementById('form-overlay').classList.remove('open');
  }

  function submitNodeByEmail() {
    const date     = document.getElementById('f-date').value;
    const category = document.getElementById('f-category').value;
    const title    = document.getElementById('f-title').value.trim();
    const text     = document.getElementById('f-text').value.trim();
    const source   = document.getElementById('f-source').value.trim();
    const image    = document.getElementById('f-image').value.trim();

    if (!date || !title) {
      alert('Please fill in at least the Date and Title.');
      return;
    }

    const subject = encodeURIComponent(`[Timeline Node] ${title} (${date})`);
    const body = encodeURIComponent(
            `New timeline node submission:

Title:    ${title}
Date:     ${date}
Category: ${category}
Text:     ${text || '(none)'}
Source:   ${source || '(none)'}
Image:    ${image || '(none)'}

---
Submitted via the Timeline tool.`
    );

    window.location.href = `mailto:emmareeb@gmail.com?subject=${subject}&body=${body}`;
    closeAddForm();
  }

  // Close form modal on backdrop click
  document.getElementById('form-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeAddForm();
  });

  // ─── SVG HELPER ──────────────────────────────────────────────────────────────
  function svgEl(tag, attrs = {}) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────────
  render();
  window.addEventListener('resize', render);
</script>
</body>
</html>
